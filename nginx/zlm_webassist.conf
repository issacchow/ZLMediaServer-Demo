server {
    listen 80;
    server_name _;

    # 前端静态文件
    root /zlm_webassist;
    index index.html;

    # SPA 路由兜底
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 反向代理 ZLMediaKit API
    location /index/api/ {
        proxy_pass http://zlm_server:80/index/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # ⚠️ 关键：自动注入 API Secret，避免前端硬编码
        # 请将下方值替换为你 config.ini 中 [api] -> secret 的实际值
        proxy_set_header X-API-Secret "Rd1mk2MiuNaaIdajeWKqUzy8HktmIznB";
    }
}
